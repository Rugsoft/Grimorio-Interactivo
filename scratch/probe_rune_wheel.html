<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonda visual — Rueda Rúnica y Halo de Aura (SPEC-06, Fase 3)</title>
<style>
  /* Sonda interna (scratch/): Dogma Vanilla, cero frameworks. */
  :root {
    --bg: #141318;
    --panel: #24201c;
    --ink: #f5f0e6;
    --gold: #d4a94e;
    --muted: #9e9382;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'EB Garamond', serif;
  }
  h1 { font-variant: small-caps; letter-spacing: 0.06em; color: var(--gold); margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  section {
    background: var(--panel);
    border: 1px solid #3d352b;
    border-radius: 12px;
    padding: 16px;
  }
  h2 { font-size: 1rem; color: var(--gold); margin: 0 0 12px; font-variant: small-caps; }
  /* Escenario del maniquí: contenedor relativo para el halo absoluto. */
  #dummy-stage {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 8px auto 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #2b2a29, #0c0b0e 70%);
    border: 2px solid #3d352b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #dummy-stage::after {
    content: '🜚';
    font-size: 64px;
    opacity: 0.85;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 8px 14px;
    min-height: 44px;
    background: #1c1916;
    color: var(--ink);
    border: 1px solid #3d352b;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #event-log {
    margin-top: 12px;
    height: 120px;
    overflow-y: auto;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px dashed #3d352b;
    padding-top: 8px;
  }
  #event-log div b { color: var(--gold); }
  #wheel-host { min-height: 380px; }
  /* Texto Flotante Monumental (RF-06.2): la hoja real lo define. */
  #combat-stage { position: relative; min-height: 70px; }
</style>
<link rel="stylesheet" href="/public/assets/css/tokens.css">
<link rel="stylesheet" href="/public/assets/css/components/elemental-codex.css">
</head>
<body>
<h1>Sonda del Códice Elemental — Fase 3 (SPEC-06)</h1>
<p class="lead">Rueda Rúnica y halo de aura montados con el catálogo real de <code>/api/v1/elements/matrix</code>. Pasa el cursor o pulsa los glifos; imbuye auras y observa el anillo decreciente.</p>

<main>
  <section>
    <h2>Maniquí de pruebas</h2>
    <div id="dummy-stage"></div>
    <div class="controls" id="aura-controls"></div>
    <div class="controls" style="margin-top:8px">
      <button id="btn-refresh">Refrescar aura</button>
      <button id="btn-dissipate">Disipar</button>
      <button id="btn-detonate">Detonar combo</button>
    </div>
    <div id="combat-stage"></div>
    <div id="event-log" aria-live="polite"></div>
  </section>

  <section>
    <h2>Códice de Afinidades</h2>
    <div id="wheel-host"></div>
  </section>
</main>

<script type="module">
  // Sonda de verificación: consume la API real y monta los componentes de la Fase 3.
  const log = document.getElementById('event-log');
  function logEvent(label, detail) {
    const row = document.createElement('div');
    const stamp = new Date().toLocaleTimeString('es-ES', { hour12: false });
    const bold = document.createElement('b');
    bold.textContent = `[${stamp}] ${label}`;
    row.appendChild(bold);
    if (detail) {
      row.appendChild(document.createTextNode(' ' + JSON.stringify(detail)));
    }
    log.prepend(row);
  }

  // 1. Catálogo real del Códice (Endpoint 1).
  const response = await fetch('/api/v1/elements/matrix');
  const payload = await response.json();
  if (!payload.success) throw new Error('El Códice no respondió: ' + JSON.stringify(payload.error));
  const catalog = payload.data;
  logEvent('Códice cargado', { elements: catalog.elements.length, reactions: catalog.reactions.length });

  // 2. Rueda Rúnica con el catálogo de la API.
  const { createElementalWheelComponent } = await import('/public/assets/js/components/elementalWheelComponent.js');
  const wheel = createElementalWheelComponent({ catalog });
  wheel.mount(document.getElementById('wheel-host'));
  wheel.eventTarget = null; // la fábrica no expone el target: usamos window para el aura.
  logEvent('Rueda Rúnica montada');

  // 3. Halo de aura sobre el maniquí, gobernado por el bus de combos.
  const { createElementalAuraComponent } = await import('/public/assets/js/components/elementalAuraComponent.js');
  const aura = createElementalAuraComponent({ eventTarget: window });
  aura.mount(document.getElementById('dummy-stage'));
  for (const type of ['combo:aura-applied', 'combo:aura-refreshed', 'combo:aura-expired']) {
    window.addEventListener(type, (event) => logEvent(type, event.detail));
  }
  logEvent('Halo de aura montado');

  // 4. Controles del aura: un botón por elemento canónico.
  const controls = document.getElementById('aura-controls');
  for (const element of catalog.elements) {
    const button = document.createElement('button');
    button.textContent = element.name;
    button.addEventListener('click', () => {
      window.dispatchEvent(new CustomEvent('combo:aura-applied', {
        detail: { element: element.id, expiresAt: Date.now() + 5000 },
      }));
      logEvent('Imbuir', { element: element.id, color: element.color });
    });
    controls.appendChild(button);
  }
  document.getElementById('btn-refresh').addEventListener('click', () => {
    window.dispatchEvent(new CustomEvent('combo:aura-refreshed', {
      detail: { element: aura.getActiveElement(), expiresAt: Date.now() + 5000 },
    }));
  });
  document.getElementById('btn-dissipate').addEventListener('click', () => aura.dissipate());

  // 5. Deflagración de demostración: Texto Flotante Monumental (RF-06.2).
  document.getElementById('btn-detonate').addEventListener('click', () => {
    const stage = document.getElementById('combat-stage');
    stage.textContent = '';
    const reaction = catalog.reactions[Math.floor(Math.random() * catalog.reactions.length)];
    const label = document.createElement('div');
    label.className = 'elemental-combat-text';
    // El catalizador no porta daño propio: amplifica el aura (+25% y +1 s).
    label.textContent = reaction.damageMultiplier === undefined
      ? `¡${reaction.name.toUpperCase()}! +25% y +1 s`
      : `¡${reaction.name.toUpperCase()}! -${Math.round(40 * reaction.damageMultiplier)} PV`;
    stage.appendChild(label);
    logEvent('combo:reaction-triggered', { reactionId: reaction.id, damage: Math.round(40 * reaction.damageMultiplier) });
    setTimeout(() => label.remove(), 1700);
  });
</script>
</body>
</html>
